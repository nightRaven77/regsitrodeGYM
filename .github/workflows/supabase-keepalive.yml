name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 05:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: '0 5 */3 * *'
  workflow_dispatch: # Allows manual trigger directly from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Supabase & Prevent Auto-Pause
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Keep-Alive Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary sqlalchemy httpx

      - name: 🏓 Run Supabase Keep-Alive Ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python scripts/ping_supabase.py
