[project]
name = "gymtracker"
version = "2.0.0"
description = "CenterFit GymTracker PWA - Modern Offline-First Gym Tracker & Analytics API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.uv]
package = false
